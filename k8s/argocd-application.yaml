apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoaim-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-repo/your-web-project.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
